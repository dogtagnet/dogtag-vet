apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dogtag-vet.fullname" . }}-worker
  labels:
    {{- include "dogtag-vet.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # Exactly one replica, always - the chain-activity follower and payment watcher each keep a
  # single cursor in Mongo (ClinicSettings.activityCursorBlock, PaymentChainCursor); two workers
  # racing the same cursor would double-process blocks, not add throughput. Scale this clinic's
  # load by tuning ACTIVITY_POLL_MS / PAYMENT_WATCHER_POLL_MS, never by replica count.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dogtag-vet.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "dogtag-vet.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dogtag-vet.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          ports:
            - name: healthz
              containerPort: {{ .Values.worker.healthPort }}
          env:
            # WP4.17 B10 - sourced from .Values.worker, never .Values.env, so containerPort/the
            # probes below and the env var this process actually reads can never drift apart.
            - name: WORKER_HEALTH_PORT
              value: {{ .Values.worker.healthPort | quote }}
            - name: WORKER_STALL_MINUTES
              value: {{ .Values.worker.stallMinutes | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if or .Values.existingSecret .Values.secretEnv }}
          envFrom:
            - secretRef:
                name: {{ include "dogtag-vet.secretName" . }}
          {{- end }}
          # WP4.17 B10 - GET /healthz (readiness: Mongo connectivity plus both loops' recent
          # progress) and GET /livez (liveness: both loops' recent progress only, never Mongo - a
          # dependency outage marks this worker not-ready without ever restarting the container
          # over it). See src/lib/health/workerHealth.ts for the full readiness/liveness split.
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
