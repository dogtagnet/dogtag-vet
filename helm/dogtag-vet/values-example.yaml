# Documented example `helm/dogtag-vet` install for one clinic (WP4.17 B14). Not applied to any
# real cluster by anything in this repo - it exists so:
#
#   1. an operator has a complete, realistic starting point to copy and edit (every value below
#      is either a placeholder or a value this repo's own docs/tests already treat as a fixture -
#      see "fake, not real" below), and
#   2. `tests/unit/helmTemplateSnapshot.test.ts` can render this exact file and snapshot the
#      output, so an unintentional change to the chart's templates - a probe silently dropped, a
#      value silently no longer wired to anything - shows up as a failing test instead of only
#      being noticed on a real cluster.
#
# Install with:
#   helm install dogtag-vet helm/dogtag-vet -f helm/dogtag-vet/values-example.yaml \
#     --set existingSecret=dogtag-vet-secrets
# (dropping the --set and using this file's own `secretEnv` below also works for a quick/throwaway
# install - see values.yaml's own comment on preferring existingSecret for anything real.)
#
# FAKE, NOT REAL: every address, URL, and "secret" below is a placeholder - the four contract
# addresses are the same 0x1111.../0x2222.../0x3333.../0x4444... sentinel pattern WP4.17 B16's
# Compose smoke test uses to prove runtime injection, `AUTH_SECRET`/`EMAIL_SERVER` below are
# obviously-fake strings, never a value generated by `openssl rand` or a real SMTP account.

image:
  web:
    repository: your-registry/dogtag-vet-web
    tag: v1
  worker:
    repository: your-registry/dogtag-vet-worker
    tag: v1

web:
  replicaCount: 1

worker:
  replicaCount: 1
  healthPort: 8091
  stallMinutes: 10

env:
  PUBLIC_BASE_URL: https://vet.example-clinic.test
  MONGODB_URI: mongodb://mongo:27017/dogtag-vet
  NODE_ENV: production
  # See values.yaml's own comment on this specific key: a plain value here is safe ONLY because
  # this example does not also reference AUTH_TRUST_HOST from existingSecret/secretEnv below -
  # `env:` would shadow it either way if it did.
  AUTH_TRUST_HOST: "1"
  ROAX_RPC_URL: https://devrpc.roax.net
  ROAX_CHAIN_ID: "135"
  ROAX_EXPLORER_URL: https://explorer.roax.net
  VET_ISSUER_FACTORY_ADDRESS: "0x1111111111111111111111111111111111111111"
  ENTITY_REGISTRY_ADDRESS: "0x2222222222222222222222222222222222222222"
  DOGTAG_SBT_ADDRESS: "0x3333333333333333333333333333333333333333"
  VERIFICATION_REGISTRY_ADDRESS: "0x4444444444444444444444444444444444444444"
  DELEGATION_REGISTRY_ADDRESS: "0x5555555555555555555555555555555555555555"

# Throwaway-install convenience only (see the `helm install` command above) - a REAL deployment
# uses existingSecret against a Secret you created yourself, never this. Every value below is a
# placeholder; none of them work against anything.
secretEnv:
  AUTH_SECRET: REPLACE-WITH-openssl-rand--base64-32
  EMAIL_SERVER: smtp://REPLACE_USER:REPLACE_PASSWORD@smtp.example-clinic.test:587
  EMAIL_FROM: no-reply@example-clinic.test

ingress:
  enabled: false
