services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # No host port published: only the web and worker services reach mongo, over the compose
    # network. Expose 27017 yourself (or add a port mapping) only if you need to reach it directly
    # for backups or debugging - see docs/DEPLOY.md.

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/dogtag-vet

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      - mongo
    # WORKER_HEALTH_PORT default (WP4.17 B10, see .env.example) - published so `curl
    # localhost:8091/healthz` works from the host without any extra config. Change both sides of
    # this mapping together if you override WORKER_HEALTH_PORT.
    ports:
      - "8091:8091"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/dogtag-vet
    # node:22-slim has no curl/wget; Node's own global fetch (Node 22+) needs no extra tooling in
    # the image. Feeds `docker compose ps`'s health column - Docker/Compose does NOT restart a
    # container on an unhealthy healthcheck by itself (`restart: unless-stopped` above only reacts
    # to the container actually exiting), so an unhealthy worker still needs an operator (or an
    # external watcher) to notice and act; this is visibility, not self-healing.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8091/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mongo-data:
