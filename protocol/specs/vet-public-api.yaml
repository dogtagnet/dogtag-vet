openapi: 3.1.0
info:
  title: DogTag Vet Public API
  version: "2.0.0"
  description: |-
    The standardized public surface every self-deployable dogtag-vet platform exposes.
    This is the protocol contract between a vet deployment and the two consumers that never
    hold vet staff credentials: the pet-owner mobile apps and third-party relayers.
    Vet staff surfaces (CRM, CRM auth, contract-signing wallet flows) are deployment-internal
    and out of scope for this spec.
    Wire shapes marked "v1-compatible" are byte-compatible with the fields the v1 mono-repo
    shipped, per `docs/architecture-v2.md`.
    Every response uses the error envelope in `#/components/schemas/Error` on failure, and
    every route is subject to the rate-limit headers documented in `#/components/headers`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
# No header/cookie/query API-key scheme: every route in this spec is access-controlled by
# possession of an opaque, high-entropy token carried as a path or query parameter (documented
# per-parameter below) rather than a conventional auth header, and OpenAPI has no security-scheme
# shape for a path-embedded bearer credential. `security: []` records this deliberately, so the
# absence reads as "considered, not applicable" rather than "forgotten".
security: []
servers:
  - url: "https://{vetHost}"
    description: A single vet deployment's own base URL (discovered from `adminApiUrl` -> the entity's `platformBaseUrl`; never bundled by mobile apps).
    variables:
      vetHost:
        default: vet.example.com
tags:
  - name: mint
    description: Mint-session flow (vet mints a dogtag; owner's app resolves and posts the custodial bind).
  - name: verify
    description: Verify-session flow (a relayer requests consent; owner's app resolves and submits a proof).
  - name: wallet-registration
    description: Client wallet registration (vet starts a session for bookkeeping; owner's app resolves the challenge, signs an EIP-712 binding, and posts the completion). No on-chain writes.
  - name: booking
    description: Calendly-style appointment booking against the vet's own availability.
  - name: payments
    description: Payment status and receipt retrieval for invoices raised by the vet.
  - name: entity
    description: The vet's own public entity card, served for in-app display once discovered via the admin directory.
  - name: tag-custody
    description: |-
      Export/import ceremonies for a pet's custodial TagArtifact (the vet's verify-at-write
      copy of a pet's opened profile-tree leaves - plans/wp4.9-tag-data-custody.md). The vet
      starts a session in person; the owner's app scans a QR and resolves it. No on-chain
      writes happen as part of either ceremony.
x-common-headers:
  rateLimit: &rateLimitHeaders
    X-RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
    X-RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
    X-RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
paths:
  /p/{token}:
    get:
      operationId: resolveMintSession
      tags: [mint]
      summary: Resolve a mint session
      description: |-
        Mobile-facing, v1-compatible shape. The owner's app scans the vet's mint QR
        (`https://<vet>/p/<32hex>`, see `specs/qr-formats.md`) and calls this to fetch the
        vet-attested pet/owner attributes it will fold into the on-device profile tree.

        **Non-consuming**: calling this does not burn the token - the owner may resolve the
        same session repeatedly (e.g. app restart, slow network) up to `POST
        /profiles/issue/custodial-bind`, which IS the consuming action. The first successful
        resolve extends the session's TTL once, so a slow owner does not lose the session
        to the counter clerk's original short-lived QR window.
      parameters:
        - $ref: '#/components/parameters/MintToken'
      responses:
        "200":
          description: Session resolved.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintSessionResolveResponse'
        "404":
          description: Token unknown or malformed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "410":
          description: Token already consumed by a completed `custodial-bind` (past the status grace period) or naturally expired.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /profiles/issue/custodial-bind:
    post:
      operationId: postCustodialBind
      tags: [mint]
      summary: Post the device-built profile tree for a mint session (consumes the token)
      description: |-
        The owner's app has built the profile tree locally (3 reserved owner-control leaves +
        vet-attested attribute leaves + `owner.identity.*` leaves), computed the root `R`, and
        now posts the opened leaves for the vet to independently recompute and bind-check
        (`verifyLeafCommitment` in `packages/dogtag-standard-ts` - fail closed: every opened
        leaf hash is recomputed server-side, never trusted from the wire).

        On success the platform indexes the bind and a staff wallet later confirms `issueTag`
        on the vet's `VetIssuer` clone; `status` in the response reflects that this is
        asynchronous - a `200` here means "bind accepted", not "sealed on chain" (poll
        `GET /p/{token}/status` for that).

        **Consumes the token.** A second call against the same token after a successful bind
        returns `409`; a call against a token that was never valid, or whose mint session
        already expired, returns `410`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustodialBindRequest'
      responses:
        "200":
          description: Bind accepted; issuance is now in progress (or already sealed, for a re-read within the grace period - see `status`).
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustodialBindResponse'
        "400":
          description: |-
            The posted tree failed the fail-closed bind-commitment check: a malformed opening,
            a wrong leaf count, a reserved-hash count other than 3, or a recomputed root that
            does not equal `root`. `error.code` is one of `leaf_commitment_invalid`,
            `identity_leaves_mismatch`, `malformed_leaf`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: Token unknown or malformed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "409":
          description: This token was already successfully bound. `error.details.dogTagId` names the existing tag.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "410":
          description: Token expired, or was never valid.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /p/{token}/status:
    get:
      operationId: getMintSessionStatus
      tags: [mint]
      summary: Poll a mint session's issuance status
      description: |-
        Device-safe sentences only in `reason` - never a raw error, stack trace, or internal
        identifier. This endpoint keeps answering for a grace period after the token is
        consumed by `custodial-bind` (so the owner's app can keep polling the same token
        through on-chain confirmation instead of needing the bind response cached), then
        starts returning `410` once the grace period elapses.
      parameters:
        - $ref: '#/components/parameters/MintToken'
      responses:
        "200":
          description: Current status.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintSessionStatusResponse'
        "404":
          description: Token unknown or malformed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "410":
          description: Token never bound and expired, or past the post-bind grace period.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /w/{token}:
    get:
      operationId: resolveWalletRegistrationChallenge
      tags: [wallet-registration]
      summary: Resolve a wallet-registration challenge
      description: |-
        The owner's app scans the vet's wallet-registration QR (`https://<vet>/w/<32hex>`, see
        `specs/qr-formats.md`) and calls this to fetch the EIP-712 challenge it will present on a
        consent screen and then sign - `clinicName`/`maskedClientName` are shown to the owner;
        `clientHash`/`registrationId`/`issuedAt`/`blockNumber`/`deadline` are folded verbatim into
        the `ClientRegistration` struct the app signs (see the WP4.2 spec's "The signed message").

        **No raw client PII is ever returned here** - `maskedClientName` only (first letter per
        word, asterisks for the rest); the client's email, phone, and address never leave the
        server. `clientHash` is an opaque commitment the app signs over without being able to open
        it - the owner is vouching for the displayed clinic + masked name, not for PII contents it
        cannot see (docs/client-wallet-registration.md's trust model).

        **Non-consuming**: calling this does not burn the token - `POST /w/{token}/complete` is the
        consuming action. Unlike the mint session's `/p/{token}`, there is no TTL-extension-on-
        first-resolve here (a registration session's window is fixed at creation).
      parameters:
        - $ref: '#/components/parameters/WalletRegistrationToken'
      responses:
        "200":
          description: Challenge resolved.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletRegistrationChallengeResponse'
        "404":
          description: Token unknown or malformed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "410":
          description: Token already consumed (successfully or not - there is no retry for a wallet-registration session) or naturally expired.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /w/{token}/complete:
    post:
      operationId: postWalletRegistrationComplete
      tags: [wallet-registration]
      summary: Submit the signed EIP-712 binding for a wallet-registration session (consumes the token)
      description: |-
        The owner's app has built the `ClientRegistration` EIP-712 message from the values
        `GET /w/{token}` returned (plus this clinic's domain), had the wallet sign it, and now
        posts the wallet address + signature. The server independently rebuilds the exact same
        domain/message from its own server-trusted session state and recovers the signer
        (`recoverTypedDataAddress`) - `wallet` in the request body is trusted only once the
        recovered signer is proven to equal it.

        On success the receipt (`{payloadJson, signature, recoveredAt}` plus a deterministic
        `receiptHash`) is appended to `Client.wallets[]` for bookkeeping. No on-chain writes happen
        as part of this call, now or ever automatically - the receipt is chain-ready (canonically
        encoded and hashed) but nothing anchors it.

        **Consumes the token**, including on a FAILED verification: a signature that does not
        recover to the claimed `wallet` still burns the token (`error.code: signature_invalid`) -
        there is no retry endpoint for this flow, unlike mint's `/retry`. A second call against an
        already-consumed token - whether the first call succeeded or failed - returns `410`.
      parameters:
        - $ref: '#/components/parameters/WalletRegistrationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletRegistrationCompleteRequest'
      responses:
        "200":
          description: Wallet registered; the receipt has been persisted.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletRegistrationCompleteResponse'
        "400":
          description: "`error.code` is `signature_invalid`: malformed request body, or the recovered signer does not equal the claimed `wallet`."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: Token unknown or malformed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "409":
          description: "`error.code` is `already_registered`: this wallet address is already registered to this client."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "410":
          description: "`error.code` is `expired_or_reused`: the token was already consumed (by a prior success OR a prior failed attempt), or it simply expired."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /e/{token}:
    get:
      operationId: resolveArtifactExport
      tags: [tag-custody]
      summary: Fetch a pet's exported tag data (one-time; consumes the token)
      description: |-
        The owner's app scans the vet's export QR (`https://<vet>/e/<32hex>`,
        plans/wp4.9-tag-data-custody.md section 2.2, generalized by plans/wp4.10-masked-export.md
        section 2) and calls this to fetch the pet's currently-active `TagArtifact`, as a
        `RedactedTagArtifact` (`specs/schemas/dogtag.redacted-tag-artifact.v1.schema.json`): every
        DISCLOSED profile-tree leaf opening, plus a hash for every leaf staff chose to mask (or
        that this artifact already only held a hash for - partial custody from an earlier masked
        import), plus the 3 reserved owner-control leaf hashes. An export with no mask - the
        pre-WP4.10V default, and still the common case - is this format's degenerate case:
        `obfuscatedLeafHashes` empty, `disclosed` holding every attribute leaf. The server never
        trusts a stored hash for a newly-masked leaf: it recomputes it fresh from the opening,
        and self-checks the WHOLE payload (`verifyRedactedArtifact`) before ever serving it - the
        ceremony is deliberately in-person and short-lived (600s) either way.

        **ONE-TIME**: unlike every other resolve route in this spec, THIS single `GET` both
        resolves AND atomically consumes the token - there is no separate `/complete` step,
        since the phone only ever reads. A concurrent second call against the same token always
        loses the race (`410`), never receives a second copy of the payload.

        `root` is fixed at the moment the vet started this session (the pet's active artifact
        at that instant), not re-read live - if the pet's tag was superseded (a `replace`)
        between session creation and the scan, this returns `410` with `error.code: superseded`
        rather than silently substituting different data than what the vet saw on screen when
        the QR was generated.
      parameters:
        - $ref: '#/components/parameters/ArtifactExportToken'
      responses:
        "200":
          description: Tag data resolved; the token is now consumed.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactExportResponse'
        "404":
          description: Token unknown or malformed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "410":
          description: "`error.code` is one of `expired_or_reused` (already consumed, by this call or a lost race, or naturally expired), `revoked` (the pet's tag has been revoked at this clinic since the session was created), or `superseded` (the tag has since been replaced - ask the clinic for a new code)."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /i/{token}:
    get:
      operationId: resolveArtifactImport
      tags: [tag-custody]
      summary: Resolve an import-ceremony session (non-consuming)
      description: |-
        The owner's app scans the vet's import QR (`https://<vet>/i/<32hex>`,
        plans/wp4.9-tag-data-custody.md section 2.3) and calls this to show a confirmation screen
        before submitting anything - "send your tag's data to `clinicName`, for `targetPetName`
        (or a brand-new pet record, when `isNewPet`)". The target (an existing pet, or "create
        new") was chosen by STAFF at session-creation time, never by this call or the owner's app.

        **Non-consuming**: `POST /i/{token}/complete` is the consuming action, mirroring
        `GET /w/{token}`'s exact shape (unlike `GET /e/{token}`, which is single-step because the
        phone only ever reads there).
      parameters:
        - $ref: '#/components/parameters/ArtifactImportToken'
      responses:
        "200":
          description: Session resolved.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactImportResolveResponse'
        "404":
          description: Token unknown or malformed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "410":
          description: Token already consumed or naturally expired.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /i/{token}/complete:
    post:
      operationId: postArtifactImportComplete
      tags: [tag-custody]
      summary: Submit verified tag data to complete an import (consumes the token)
      description: |-
        The owner's app submits its tag's `dogTagIdDec`/`dogTagIdField` plus its FULL opened
        profile-tree leaves and the 3 reserved owner-control leaf hashes - selective disclosure is
        out of scope here for the same reason it is for export (a partial leaf set cannot
        recompute the root). `root` is deliberately NOT part of this request: the server always
        reads the CURRENT `profileRoot` for the claimed `dogTagIdField` live from chain, never
        trusts a client-supplied root - this is what makes "a replaced root imports as its current
        self" and "a tag reinstated after being revoked succeeds on a fresh scan" true for free,
        with no cache to invalidate and no special-cased retry logic.

        Gate order (plans/wp4.9-tag-data-custody.md section 2.3's shared verifier, item 4): dec/
        field consistency -> `profileRoot` -> `rootIssuer` -> `isValid` against the ISSUER clone ->
        `verifyLeafCommitment`. Attaching the tag (`external: true` unless the issuer turns out to
        be THIS clinic's own clone - the "reclaim" case) only happens once every gate passes, via
        ONE atomic conditional write that refuses if the target already gained an active tag in the
        interim (`already_has_active_tag`) - never a check-then-write race. A previously-empty
        field on the target pet is filled from the verified data; a field that already had a
        DIFFERENT value is never overwritten (kept exactly as the clinic had it) and is instead
        reported back for the owner-facing pet-page conflict banner.

        **Consumes the token on EVERY outcome**, success or refusal - there is no retry, mirroring
        `POST /w/{token}/complete`'s own "a burned token, whether by success or a bad signature, is
        simply dead" rule. This includes `chain_unreadable`, even though neither the owner nor the
        tag did anything wrong in that case - the response copy says "generate a new code and try
        again", never anything implying a verification failure.

        **400 vs 409**: `malformed_claim`/`chain_unreadable`/`root_unset` (400) mean no valid claim
        could be established at all (a client-side shape problem, an unreadable chain, or a tag
        that plain does not exist on chain); `revoked`/`verify_failed`/`already_has_active_tag`
        (409) mean a real claim/target WAS identified, but its current state conflicts with
        completing this import.
      parameters:
        - $ref: '#/components/parameters/ArtifactImportToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactImportCompleteRequest'
      responses:
        "200":
          description: Import completed; the tag is now attached.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactImportCompleteResponse'
        "400":
          description: "`error.code` is one of `malformed_claim`, `chain_unreadable`, or `root_unset` - see this route's own description for the 400-vs-409 rule."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: Token unknown or malformed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "409":
          description: "`error.code` is one of `revoked`, `verify_failed`, or `already_has_active_tag` - see this route's own description for the 400-vs-409 rule."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "410":
          description: "`error.code` is `expired_or_reused`: the token was already consumed (by a prior success OR a prior refusal), or it simply expired."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /x/{token}:
    get:
      operationId: resolveVerifySession
      tags: [verify]
      summary: Resolve a verify (consent) session
      description: |-
        Mobile-facing, v1-compatible shape. The owner's app scans a relayer's verify QR
        (`https://<vet>/x/<32hex>?a=<relayer>`, see `specs/qr-formats.md`) and calls this to
        fetch the parameters it needs to build the consent proof on device - `dogtag-prover-rs`
        assembles the witness from `challenge` plus the owner's locally-held secrets; no owner
        secret material ever crosses this endpoint in either direction.
        Non-consuming: proof submission (`POST /v1/verify/consent`) is the action that
        eventually spends the session's nullifier on chain, not this resolve call.
      parameters:
        - $ref: '#/components/parameters/VerifyToken'
      responses:
        "200":
          description: Session resolved.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifySessionResolveResponse'
        "404":
          description: Token unknown or malformed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "410":
          description: Session expired (past its `deadline`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /v1/verify/consent:
    post:
      operationId: postVerifyConsent
      tags: [verify]
      summary: Submit a device-generated consent proof to the verification registry
      description: |-
        The relayer-facing standardized endpoint (kept from v1). Submits a Groth16 proof over
        the frozen `DogTagConsent(6)` circuit to `VerificationRegistryConsent` on ROAX. No
        server-side proving path exists in v2 (C2) - this endpoint only ever forwards a
        proof the device already produced; it never accepts an `ownerSecret` or any owner
        secret material.

        `profileDisclosure`, when present, is verified independently
        (`verifyProfileDisclosure` in `packages/dogtag-standard-ts`) and is bound to this
        submission by requiring `profileDisclosure.R == pubSignals[4]` and
        `profileDisclosure.dogTagId == pubSignals[0]` - a disclosure envelope presented without
        an accompanying valid consent proof for the same `R` is a replayable bearer credential
        and MUST be rejected on its own.

        **Consumes** `exportToken` on a successful on-chain submission (the nullifier is spent);
        a replayed proof or token returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyConsentRequest'
      responses:
        "200":
          description: Proof accepted and submitted; `Verified` fired on chain.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyConsentResponse'
        "400":
          description: Malformed proof shape, public-signal count/order mismatch, or a `profileDisclosure` that fails pure verification or does not bind to `pubSignals`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: "`exportToken`/`sessionId` unknown."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "409":
          description: Nullifier already spent (replay), or the tag's on-chain `status` is not `Active`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "410":
          description: Session/token expired (past `deadline`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /v1/booking/services:
    get:
      operationId: listBookingServices
      tags: [booking]
      summary: List public bookable services
      responses:
        "200":
          description: The vet's public service list.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BookingService'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /v1/booking/availability:
    get:
      operationId: getBookingAvailability
      tags: [booking]
      summary: List open slots for a service in a date range
      description: |-
        Honors the vet's weekly availability rules, one-off exceptions, per-service buffers,
        per-slot capacity, and already-booked appointments - every slot returned is bookable
        at the instant it was computed (a concurrent booking can still race it; `POST
        /v1/booking/book` is the authority and returns `409` on a lost race).

        WP4.7 (D5) - a vet deployment running per-practitioner scheduling additionally returns
        `practitioners` and each slot's `practitionerIds` (see their own schema descriptions
        below). A deployment running whole-clinic scheduling (the default, and the only mode
        that existed before WP4.7) omits both entirely - never present as an empty array - so
        this response is byte-identical to what every client has always received, and an old
        client that has never heard of either key is unaffected either way.
      parameters:
        - name: serviceId
          in: query
          required: true
          schema: {type: string}
        - name: from
          in: query
          required: true
          description: Inclusive range start, ISO 8601 instant.
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: true
          description: Exclusive range end, ISO 8601 instant. MUST NOT span more than 31 days.
          schema: {type: string, format: date-time}
      responses:
        "200":
          description: Open slots in the range.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                type: object
                required: [slots]
                properties:
                  slots:
                    type: array
                    items: {$ref: '#/components/schemas/BookingSlot'}
                  practitioners:
                    type: array
                    description: |-
                      WP4.7 (D5) - the vet's bookable practitioners, present ONLY when this
                      deployment is running `schedulingMode: "practitioner"`. Absent entirely
                      (not an empty array) under whole-clinic scheduling.
                    items: {$ref: '#/components/schemas/BookingPractitioner'}
        "400":
          description: "`serviceId` unknown, or `to` <= `from`, or the range exceeds 31 days."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /v1/booking/book:
    post:
      operationId: bookAppointment
      tags: [booking]
      summary: Book an open slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAppointmentRequest'
      responses:
        "201":
          description: Appointment created.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookAppointmentResponse'
        "400":
          description: |-
            Malformed request (missing client contact, invalid `startAt`, unknown `serviceId`), or
            (WP4.4) a `mobile.wallet` claim that failed verification - `error.code` is
            `wallet_claim_invalid` (bad/expired/malformed signature, or an invalid time window;
            `error.details.reason` names the specific check that failed) or
            `wallet_claim_replayed` (this exact signed claim already booked something). Either way
            the WHOLE booking is rejected, never partially processed.
            WP4.7 (D5): under `schedulingMode: "practitioner"`, a `practitionerId` that does not
            name a currently-bookable practitioner also returns 400 with
            `error.code: invalid_input` - the same generic code the missing-client-contact and
            invalid-`startAt` cases above already use, not a new one.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "409":
          description: The slot was taken by a concurrent booking, or capacity is exhausted for that slot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "503":
          description: "(WP4.4) `error.code` is `clinic_not_configured`: the request carried a `mobile.wallet` claim but this clinic has no discovered on-chain clone to verify it against."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "5XX":
          $ref: '#/components/responses/ServerError'

  /v1/booking/appointments/{id}:
    get:
      operationId: getAppointmentStatus
      tags: [booking]
      summary: Client-facing appointment status
      description: Requires the per-appointment `token` issued at booking time - returned directly as `BookAppointmentResponse.token` (WP4.4; also still embedded in the confirmation email's manage link, which decodes to the same value) - this endpoint carries no staff auth.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/AppointmentToken'
      responses:
        "200":
          description: Appointment status.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentStatusResponse'
        "401":
          description: "`token` missing or does not match `id`."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: Appointment unknown.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /v1/booking/appointments/{id}/cancel:
    post:
      operationId: cancelAppointment
      tags: [booking]
      summary: Cancel a booked appointment
      description: |-
        The cancel action implied by the client-facing status surface: `GET
        .../appointments/{id}` is read-only, so cancellation is this companion action, gated
        by the same per-appointment `token`.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/AppointmentToken'
      responses:
        "200":
          description: Cancelled.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentStatusResponse'
        "401":
          description: "`token` missing or does not match `id`."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: Appointment unknown.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "409":
          description: Already cancelled, or too close to `startAt` per the vet's cancellation policy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /v1/payments/{id}/public:
    get:
      operationId: getPaymentPublicStatus
      tags: [payments]
      summary: Public payment status and receipt availability
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: token
          in: query
          required: true
          description: The one-time payment-view token stamped on the invoice's QR.
          schema: {type: string}
      responses:
        "200":
          description: Payment status.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPublicStatusResponse'
        "401":
          description: "`token` missing or does not match `id`."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "404":
          description: Payment unknown.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /r/pay/{receiptToken}:
    get:
      operationId: downloadReceipt
      tags: [payments]
      summary: Download a payment receipt
      description: |-
        `receiptToken` is a standalone one-time-ish bearer token scoped to one paid invoice
        (distinct from the payment-view `token` above): possession is the only credential, so
        it is high-entropy (>= 128 bits) and carried only in the receipt QR printed on the
        invoice, never logged. It remains valid for the lifetime of the receipt (it is not
        burned on first download, so the owner can re-download), but a payment that is not yet
        `paid` has no receipt to serve.
      parameters:
        - name: receiptToken
          in: path
          required: true
          schema: {type: string, minLength: 22}
      responses:
        "200":
          description: The receipt.
          headers: *rateLimitHeaders
          content:
            application/pdf:
              schema: {type: string, contentEncoding: base64, contentMediaType: application/pdf}
        "404":
          description: "`receiptToken` unknown, or the payment has no receipt yet (not `paid`)."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

  /v1/entity:
    get:
      operationId: getEntityCard
      tags: [entity]
      summary: This vet's public entity card
      description: |-
        Served by the vet platform itself so an app already holding the vet's `platformBaseUrl`
        (resolved from the admin directory, `specs/admin-public-api.yaml`) can render an
        up-to-the-minute card without a second admin-API round trip.
      responses:
        "200":
          description: The entity card.
          headers: *rateLimitHeaders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityCard'
        "429":
          $ref: '#/components/responses/RateLimited'
        "5XX":
          $ref: '#/components/responses/ServerError'

components:
  parameters:
    MintToken:
      name: token
      in: path
      required: true
      description: The 32-lowercase-hex mint-session token (see `specs/qr-formats.md`).
      schema: {$ref: '#/components/schemas/Hex32Token'}
    VerifyToken:
      name: token
      in: path
      required: true
      description: The 32-lowercase-hex verify-session token (see `specs/qr-formats.md`).
      schema: {$ref: '#/components/schemas/Hex32Token'}
    WalletRegistrationToken:
      name: token
      in: path
      required: true
      description: The 32-lowercase-hex wallet-registration session token (see `specs/qr-formats.md`).
      schema: {$ref: '#/components/schemas/Hex32Token'}
    ArtifactExportToken:
      name: token
      in: path
      required: true
      description: The 32-lowercase-hex tag-data export session token (see `specs/qr-formats.md`).
      schema: {$ref: '#/components/schemas/Hex32Token'}
    ArtifactImportToken:
      name: token
      in: path
      required: true
      description: The 32-lowercase-hex tag-data import session token (see `specs/qr-formats.md`).
      schema: {$ref: '#/components/schemas/Hex32Token'}
    AppointmentToken:
      name: token
      in: query
      required: true
      description: The per-appointment client access token issued at booking time.
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |-
        Optional client-generated key; a retried POST with the same key against the same
        token returns the original response rather than re-processing (guards a mobile
        client's retry-on-timeout from double-submitting a bind).
      schema: {type: string, maxLength: 128}

  headers:
    RateLimitLimit:
      description: Requests allowed in the current window for this route + client.
      schema: {type: integer, minimum: 1}
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema: {type: integer, minimum: 0}
    RateLimitReset:
      description: Unix seconds until the window resets.
      schema: {type: integer, minimum: 0}

  responses:
    RateLimited:
      description: Rate limit exceeded for this route + client.
      headers:
        <<: *rateLimitHeaders
        Retry-After: {schema: {type: integer, minimum: 0}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServerError:
      description: Transient failure (chain read timeout, database unavailable). Retry with backoff.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    Hex32Token:
      type: string
      pattern: "^[0-9a-f]{32}$"
      description: 32 lowercase hex characters (128 bits of entropy) - the v1-compatible token grammar. See `specs/qr-formats.md`.

    Hex32:
      type: string
      pattern: "^0x[0-9a-fA-F]{64}$"
      description: A 0x-prefixed, 32-byte big-endian field element or hash.

    Hex16:
      type: string
      pattern: "^0x[0-9a-fA-F]{32}$"
      description: A 0x-prefixed 16-byte salt.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: A stable machine-readable code, e.g. `token_not_found`, `token_expired`, `leaf_commitment_invalid`, `nullifier_replayed`, `slot_conflict`, `rate_limited`.
            message:
              type: string
              description: A short, device-safe sentence. Never a stack trace, SQL fragment, or internal identifier.
            requestId:
              type: string
              description: Correlates this response with server-side logs for support.
            details:
              type: object
              additionalProperties: true
              description: Optional machine-readable context specific to `code` (e.g. `{dogTagId}` on a `409` bind conflict).

    TypeTag:
      type: integer
      enum: [0, 1, 2, 3, 4, 5]
      description: "Mandatory type discriminant for a canonical value (impl §1.1): 0=Null, 1=Bool, 2=String, 3=Integer (decimal-string bigint), 4=Decimal (fixed-point decimal string), 5=Bytes (hex-encoded in `value`)."

    OpenedLeaf:
      type: object
      required: [keyPath, saltHex, tag, value]
      properties:
        keyPath:
          type: string
          description: Dotted/bracketed path into the profile tree, e.g. `credentialSubject.name` or `owner.identity.fullName`.
        saltHex:
          $ref: '#/components/schemas/Hex16'
        tag:
          $ref: '#/components/schemas/TypeTag'
        value:
          type: string
          description: Canonical string form of the value for this `tag` (e.g. `"true"`/`"false"` for Bool, a canonical decimal-integer string for Integer, hex for Bytes).

    PetProfile:
      type: object
      description: Vet-attested pet attributes, folded by the owner's device into ordinary (disclosable) profile-tree leaves under `credentialSubject.*`.
      properties:
        species: {type: string}
        breedVbo:
          type: string
          description: Breed code from the vet's controlled vocabulary (VeNom/VBO-style breed code).
        breedLabel: {type: string}
        sex: {type: string, enum: [male, female, unknown]}
        neuterStatus: {type: string, enum: [intact, neutered, spayed, unknown]}
        dateOfBirth: {type: string, format: date}
        weightHistory:
          type: array
          items: {$ref: '#/components/schemas/WeightEntry'}

    WeightEntry:
      type: object
      required: [recordedAt, weightKg]
      properties:
        recordedAt: {type: string, format: date}
        weightKg:
          type: string
          description: Canonical decimal string (never a native float - protocol values are string-encoded to stay bit-exact through the Merkle fold).

    Microchip:
      type: object
      properties:
        code: {type: string, description: "The chip's 15-digit ISO code (or manufacturer format)."}
        standard: {type: string, enum: [ISO11784, ISO11785, FDX-B, other]}
        implantDate: {type: string, format: date}
        bodyLocation: {type: string}

    OwnerIdentity:
      type: object
      description: Vet-attested owner-identity attributes, as attested at KYC time and destined for `owner.identity.*` leaves (D1), pre-salted server-side into `identityLeaves` below.
      properties:
        countryOfIdentification: {type: string, description: ISO 3166-1 alpha-2.}
        identification: {type: string, description: "The identifying document's number/reference (passport, national id)."}
        name: {type: string}

    MintSessionResolveResponse:
      type: object
      required: [sessionId, dogTagId, status, pet, ownerIdentity, identityLeaves, unverifiedClaims, ttlSecs]
      properties:
        sessionId: {type: string}
        dogTagId:
          type: string
          description: The raw decimal handle the vet operator entered on the mint form (an off-chain convenience only - NOT the canonical on-chain id; see `onchainDogTagId` in `CustodialBindResponse`).
        status:
          type: string
          enum: [pending, ready, issuing, bound, error]
        pet:
          type: object
          required: [name, profile, microchip]
          properties:
            name: {type: string}
            profile: {$ref: '#/components/schemas/PetProfile'}
            microchip: {$ref: '#/components/schemas/Microchip'}
        ownerIdentity: {$ref: '#/components/schemas/OwnerIdentity'}
        identityLeaves:
          type: array
          description: Pre-salted `owner.identity.*` openings the device must fold into the tree verbatim (salts are vet-chosen at KYC time so they need not be re-derived).
          items: {$ref: '#/components/schemas/OpenedLeaf'}
        unverifiedClaims:
          type: object
          additionalProperties: true
          description: Owner-supplied claims the vet has NOT attested (e.g. a self-reported microchip code pending confirmation) - rendered to the owner distinctly from attested fields, never folded into the tree as vet-attested.
        ttlSecs:
          type: integer
          minimum: 0
          description: Seconds remaining before this session expires. Extended once on first successful resolve.

    CustodialBindRequest:
      type: object
      required: [token, root, leaves, reservedLeafHashes]
      properties:
        token: {$ref: '#/components/schemas/Hex32Token'}
        root: {$ref: '#/components/schemas/Hex32'}
        leaves:
          type: array
          maxItems: 61
          items: {$ref: '#/components/schemas/OpenedLeaf'}
        reservedLeafHashes:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/Hex32'}

    CustodialBindResponse:
      type: object
      required: [dogTagId, onchainDogTagId, root, protocolVersion, status]
      properties:
        dogTagId:
          type: string
          description: The raw decimal handle (echoes the mint session's off-chain convenience id).
        onchainDogTagId:
          type: string
          description: |-
            The canonical on-chain dogTagId as a decimal uint256 string -
            `dogTagIdField(dogTagId)` from `packages/dogtag-standard-ts`. This is what the SBT
            is minted with and what the consent circuit's `pub[0]` carries; NEVER the raw
            decimal handle.
        root: {$ref: '#/components/schemas/Hex32'}
        protocolVersion:
          type: string
          description: "Internal protocol version key, e.g. `dogtag-levelb/1`."
        status:
          type: string
          enum: [pending, ready, issuing, bound, error]

    ArtifactExportResponse:
      type: object
      required: [protocolVersion, dogTagIdField, root, leaves, disclosed, obfuscatedLeafHashes, reservedLeafHashes, issuerClone, chainId, petName, clinicName]
      description: |-
        The pet's currently-active `TagArtifact`, as a `RedactedTagArtifact` (WP4.10V,
        plans/wp4.10-masked-export.md section 2 - the crypto-bearing fields `protocolVersion`
        through `issuerClone` below match `specs/schemas/dogtag.redacted-tag-artifact.v1.schema.json`
        exactly, apart from the deprecated `leaves` alias described in the TRANSITION note below
        (that registry schema has no `leaves` property at all - `disclosed` is its name for the
        same data); `chainId`/`petName`/`clinicName` are display context that schema does not carry)
        plus display context. `disclosed`/`obfuscatedLeafHashes`/`reservedLeafHashes` recompute
        `root` via `verifyRedactedArtifact` - the SAME check this deployment already self-runs on
        the payload before ever serving it (never trusting a stored hash without recomputing it) -
        the owner's app SHOULD independently re-verify this on device rather than trusting the
        transport regardless. An export with no mask picked - the pre-WP4.10V default, and still
        the common case - is this format's degenerate case: `obfuscatedLeafHashes` empty,
        `disclosed`/`leaves` both holding every attribute leaf, byte-identical to what this
        endpoint always returned before `obfuscatedLeafHashes` existed.

        TRANSITION (`leaves` is a DEPRECATED ALIAS of `disclosed`, identical content, both always
        present): WP4.9M's shipped phone client (`ArtifactReceiveEngine`) decodes `leaves` as a
        non-optional field today and has no `disclosed`/`obfuscatedLeafHashes` concept yet. Once
        WP4.10M (the masked-aware phone client) ships and every consumer reads `disclosed`, drop
        `leaves` from this schema and this response.
      properties:
        protocolVersion:
          type: string
          description: "The leaf-commitment protocol version this artifact was verified under, e.g. `dogtag-v2/1`."
        schemaId:
          type: string
          description: The schema registry `$id` this credential was issued/received against, when known. Absent for some imported artifacts whose sender did not carry one.
        dogTagIdDec:
          type: string
          description: The issuing clinic's own off-chain decimal handle, when known. Absent for many imported artifacts - this label has no meaning outside the clinic that minted it.
        dogTagIdField:
          type: string
          description: The canonical on-chain dogTagId as a decimal uint256 string - `dogTagIdField(dogTagIdDec)` from `packages/dogtag-standard-ts`.
        root: {$ref: '#/components/schemas/Hex32'}
        leaves:
          type: array
          deprecated: true
          description: DEPRECATED - identical content to `disclosed` below, kept only for WP4.9M's shipped phone client, which decodes this exact key as required. New consumers should read `disclosed` instead; this field is removed once WP4.10M ships.
          items: {$ref: '#/components/schemas/OpenedLeaf'}
        disclosed:
          type: array
          description: Fully opened (unmasked) attribute leaves - every leaf this clinic holds an opening for AND staff did not choose to mask for this export. The canonical field going forward - see `leaves` above.
          items: {$ref: '#/components/schemas/OpenedLeaf'}
        obfuscatedLeafHashes:
          type: array
          description: Every attribute leaf named ONLY by its opaque hash - masked for this export, or already opaque on this artifact from an earlier masked import (partial custody, WP4.10V item 6). Empty for an ordinary, fully-disclosed export.
          items: {$ref: '#/components/schemas/Hex32'}
        reservedLeafHashes:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/Hex32'}
        issuerClone:
          type: string
          description: The `VetIssuer` clone address that issued this root, as indexed by the factory - never assumed to be the exporting clinic's own clone.
        chainId:
          type: integer
          description: The ROAX chain id, as configured server-side.
        petName:
          type: string
          description: The pet's current display name at the exporting clinic - read live, not snapshotted at session creation.
        clinicName:
          type: string
          description: The exporting clinic's configured display name. Empty string if the clinic has not set one.

    ArtifactImportResolveResponse:
      type: object
      required: [clinicName, isNewPet, ttlSecs]
      properties:
        clinicName:
          type: string
          description: This clinic's configured display name - shown so the owner knows who they are about to send tag data to.
        isNewPet:
          type: boolean
          description: "`true` when staff chose \"create new pet from verified data\" - `targetPetName` is absent in that case (there is nothing to name yet)."
        targetPetName:
          type: string
          description: The existing target pet's CURRENT display name, read live (never snapshotted) - present only when `isNewPet` is `false`.
        ttlSecs:
          type: integer
          minimum: 0
          description: Seconds remaining before this session expires.

    ArtifactImportCompleteRequest:
      type: object
      required: [reservedLeafHashes]
      description: |-
        At least one of `dogTagIdDec`/`dogTagIdField` is required; if both are present they must
        agree (`dogTagIdField(dogTagIdDec)`). At least one of `leaves`/`disclosed` is required
        (both describe the SAME thing - the disclosed openings - under two names); if both are
        sent, their content must agree exactly, or the request is rejected.

        TRANSITION (WP4.10V item 6, orchestrator ruling): `leaves` is what WP4.9M's shipped
        `ArtifactShareEngine` sends today (no `obfuscatedLeafHashes` concept); `disclosed` is the
        canonical `RedactedTagArtifact` field name (plans/wp4.10-masked-export.md section 2)
        WP4.10M (the masked-aware phone client) will send once it ships. `obfuscatedLeafHashes` is
        new and OPTIONAL - present only when the artifact being shared is itself a masked share.
      properties:
        dogTagIdDec:
          type: string
          pattern: "^[0-9]+$"
        dogTagIdField:
          type: string
          pattern: "^[0-9]+$"
        leaves:
          type: array
          deprecated: true
          maxItems: 61
          description: DEPRECATED alias of `disclosed` - see this schema's own description.
          items: {$ref: '#/components/schemas/OpenedLeaf'}
        disclosed:
          type: array
          maxItems: 61
          description: The canonical field going forward - see `leaves` above.
          items: {$ref: '#/components/schemas/OpenedLeaf'}
        obfuscatedLeafHashes:
          type: array
          maxItems: 61
          description: Leaves named only by their opaque hash - present when the shared artifact is itself a masked share (WP4.10V item 6). The combined total of reservedLeafHashes + leaves/disclosed + this array must not exceed 64.
          items: {$ref: '#/components/schemas/Hex32'}
        reservedLeafHashes:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/Hex32'}
        schemaId:
          type: string
          description: The sender's own schemaId, when their export included one (WP4.10V item 2/3).

    ArtifactImportCompleteResponse:
      type: object
      required: [ok, petId, petName, created, conflicts]
      properties:
        ok: {type: boolean}
        petId: {type: string}
        petName: {type: string}
        created:
          type: boolean
          description: "`true` when this import created a brand-new pet record; `false` when it attached to the staff-chosen existing target."
        conflicts:
          type: array
          description: |-
            Fields where the target pet ALREADY had a value that differed from the verified
            claim - the fill-empty-only merge never overwrote them. Empty when nothing conflicted
            (including always, when `created` is `true` - a brand-new pet has nothing to conflict
            with). Persisted on `Pet.dogTag.importConflicts` for the vet's own pet-page banner.
          items:
            type: object
            required: [field, petValue, verifiedValue]
            properties:
              field: {type: string, enum: [name, species, breed, sex, dateOfBirth]}
              petValue:
                type: string
                description: The value already on file for this pet (kept, never overwritten).
              verifiedValue:
                type: string
                description: The value this import's verified data claimed (not applied).

    MintSessionStatusResponse:
      type: object
      required: [status, dogTagId]
      properties:
        status:
          type: string
          enum: [pending, ready, issuing, bound, error]
        dogTagId:
          type: string
          description: The raw decimal handle, once known.
        reason:
          type: string
          description: A device-safe sentence explaining `error` status. Absent for every other status.

    WalletRegistrationChallengeResponse:
      type: object
      required: [clinicName, clone, chainId, maskedClientName, clientHash, registrationId, issuedAt, blockNumber, deadline, ttlSecs]
      properties:
        clinicName:
          type: string
          description: This clinic's configured display name - shown on the consent screen so the owner knows who they are vouching for.
        clone:
          type: string
          description: This clinic's `VetIssuer` clone address - the EIP-712 domain's `verifyingContract` AND the struct's in-message `clinic` field (redundantly, per the WP4.2 spec).
        chainId:
          type: integer
          description: The ROAX chain id, as configured server-side - the EIP-712 domain's `chainId`.
        maskedClientName:
          type: string
          description: "The client's name, masked: first letter per word, asterisks for the rest (e.g. `J***** A******`). NEVER the raw name."
        clientHash:
          $ref: '#/components/schemas/Hex32'
        registrationId:
          type: string
          description: The session's UUID v4, in standard dashed string form (right-padded to a bytes32 only inside the signed struct itself).
        issuedAt:
          type: integer
          description: Unix seconds, server-stamped at session creation - the struct's `issuedAt`.
        blockNumber:
          type: integer
          description: The ROAX head block number at session creation, server-fetched (session creation fails closed if the RPC was unreachable) - the struct's `blockNumber`.
        deadline:
          type: integer
          description: Unix seconds after which `POST /w/{token}/complete` no longer accepts this token - the struct's `deadline`.
        ttlSecs:
          type: integer
          minimum: 0
          description: Seconds remaining before this session expires.

    WalletRegistrationCompleteRequest:
      type: object
      required: [wallet, signature]
      properties:
        wallet:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
          description: The wallet address being registered - folded into the signed struct's `wallet` field; the recovered signer MUST equal this.
        signature:
          type: string
          pattern: "^0x[0-9a-fA-F]{130}$"
          description: 65-byte `r||s||v` ECDSA signature over the `ClientRegistration` EIP-712 message.

    WalletRegistrationCompleteResponse:
      type: object
      required: [ok, wallet, receiptHash]
      properties:
        ok: {type: boolean}
        wallet:
          type: string
          description: The registered wallet address, lowercased.
        receiptHash:
          $ref: '#/components/schemas/Hex32'

    VerifySessionResolveResponse:
      type: object
      required: [sessionId, relayer, purpose, recordType, challenge, unverifiedClaims]
      properties:
        sessionId: {type: string}
        relayer:
          type: string
          description: The relayer's on-chain address (`< 2^160`), as it will appear in `pubSignals[2]`.
        purpose:
          type: string
          description: The consent purpose identifier this session is requesting proof for.
        recordType:
          type: string
          description: "The record type the relayer wants proven possession of (e.g. `DOG_PROFILE`, `VACCINATION`)."
        challenge:
          $ref: '#/components/schemas/ConsentChallenge'
        unverifiedClaims:
          type: object
          additionalProperties: true
          description: Any relayer-supplied context rendered to the owner ahead of consenting (never authoritative).

    ConsentChallenge:
      type: object
      required: [dogTagId, deadline, consentNonce]
      properties:
        dogTagId:
          type: string
          description: The canonical on-chain dogTagId (decimal), matching `pubSignals[0]`.
        deadline:
          type: integer
          description: Unix seconds after which this challenge's proof is no longer acceptable - matches `pubSignals[6]`.
        consentNonce:
          type: string
          description: One-time nonce folded into the consent message `M` and the nullifier; prevents proof replay across sessions for the same purpose/relayer pair.

    GrothProof:
      type: object
      required: [a, b, c, pubSignals]
      description: |-
        A Groth16 proof over the frozen `DogTagConsent(6)` circuit. `pubSignals` MUST be
        exactly 7 entries in the pinned order `[dogTagId, purpose, relayer, nullifier, R,
        recordType, deadline]` (`docs/crypto-improvements-v2.md`) - never re-ordered or
        re-labelled by a client.
      properties:
        a:
          type: array
          items: {type: string}
          minItems: 2
          maxItems: 2
        b:
          type: array
          items:
            type: array
            items: {type: string}
            minItems: 2
            maxItems: 2
          minItems: 2
          maxItems: 2
        c:
          type: array
          items: {type: string}
          minItems: 2
          maxItems: 2
        pubSignals:
          type: array
          items: {type: string}
          minItems: 7
          maxItems: 7

    VerifyConsentRequest:
      type: object
      required: [exportToken, proof]
      properties:
        exportToken:
          type: string
          description: The relayer-facing export/session token this proof is submitted against.
        sessionId:
          type: string
          description: Optional cross-check against the `/x/{token}` session this proof was built for.
        proof: {$ref: '#/components/schemas/GrothProof'}
        profileDisclosure:
          $ref: '#/components/schemas/ProfileDisclosure'

    ProfileDisclosureEntry:
      type: object
      required: [keyPath, saltHex, tag, value, proof]
      properties:
        keyPath: {type: string}
        saltHex: {$ref: '#/components/schemas/Hex16'}
        tag: {$ref: '#/components/schemas/TypeTag'}
        value: {type: string}
        proof:
          type: array
          description: 'Root-ward `Sibling|Promote` steps: each entry is either the literal string `"promote"` or a `0x..` 32-byte sibling hash.'
          items: {type: string}

    ProfileDisclosure:
      type: object
      required: [dogTagId, R, disclosures]
      properties:
        dogTagId:
          type: string
          description: The canonical on-chain dogTagId field, as `0x..` 32-byte hex.
        R: {$ref: '#/components/schemas/Hex32'}
        disclosures:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ProfileDisclosureEntry'}

    VerifyConsentResponse:
      type: object
      required: [verified, status]
      properties:
        verified: {type: boolean}
        status:
          type: string
          enum: [verified, pending_confirmation]
          description: "`pending_confirmation` while the submission tx is not yet at the configured confirmation depth."
        nullifier:
          type: string
          description: The spent nullifier (matches `pubSignals[3]`), once known.
        txHash: {type: string}

    BookingService:
      type: object
      required: [id, name, durationMinutes]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        durationMinutes: {type: integer, minimum: 1}
        price:
          $ref: '#/components/schemas/Money'

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Canonical decimal string, minor-unit-free (e.g. `"45.00"`).
        currency:
          type: string
          description: ISO 4217 currency code.

    BookingSlot:
      type: object
      required: [startAt, endAt]
      properties:
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        practitionerIds:
          type: array
          items: {type: string}
          description: |-
            WP4.7 (D5) - the `id`s (matching `BookingPractitioner.id`) of every practitioner free
            for this exact slot, present ONLY when this deployment is running `schedulingMode:
            "practitioner"`. Absent entirely under whole-clinic scheduling, exactly like
            `practitioners` on the containing response.

    BookingPractitioner:
      type: object
      required: [id, name]
      description: WP4.7 (D5) - one bookable practitioner, as listed in a practitioner-mode availability response.
      properties:
        id: {type: string}
        name: {type: string}

    BookingClient:
      type: object
      required: [name, email]
      properties:
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: string}

    BookAppointmentRequest:
      type: object
      required: [serviceId, startAt, client]
      properties:
        serviceId: {type: string}
        startAt: {type: string, format: date-time}
        client: {$ref: '#/components/schemas/BookingClient'}
        petName: {type: string}
        notes: {type: string, maxLength: 2000}
        practitionerId:
          type: string
          description: |-
            WP4.7 (D5) - optional, backward compatible: meaningful only under
            `schedulingMode: "practitioner"`, where an old client that never sends it gets
            auto-assigned to whichever bookable practitioner is free (fewest appointments that
            day, ties broken by id). Ignored entirely under whole-clinic scheduling. Must name a
            `BookingPractitioner.id` from the matching availability response's `practitioners[]`
            that is actually free for `startAt`, or the booking is rejected with 400
            `invalid_input` (see above) - never silently reassigned to someone else.
        mobile:
          $ref: '#/components/schemas/MobileBookingBlock'

    MobileBookingBlock:
      type: object
      description: |-
        WP4.4 v2 - optional, backward compatible (an old client that never sends this keeps
        booking exactly as before). Identifies the request as coming from the DogTag app, and
        carries an optional signed wallet claim and/or an optional tag claim.
      required: [source]
      properties:
        source:
          type: string
          enum: [dogtag_app]
        wallet:
          $ref: '#/components/schemas/MobileWalletClaim'
        pet:
          $ref: '#/components/schemas/MobilePetClaim'

    MobileWalletClaim:
      type: object
      description: |-
        A `MobileBooking` EIP-712 signature (`docs/mobile-booking.md`, normative struct
        definition) over a domain/message the SERVER rebuilds itself - `clinic` (this clinic's
        own on-chain clone address) and `bookingHash` (keccak256 over the canonical booking
        content) are never accepted from the wire, only recomputed server-side, so this schema has
        no field for either. An invalid signature (bad recovery, expired, replayed bookingHash)
        rejects the WHOLE booking, not just the wallet claim.
      required: [address, signature, issuedAt, deadline]
      properties:
        address:
          type: string
          pattern: "^0x[0-9a-fA-F]{40}$"
          description: The claimed wallet address - the struct's `wallet` field; the recovered signer MUST equal this.
        signature:
          type: string
          pattern: "^0x[0-9a-fA-F]{130}$"
          description: 65-byte `r||s||v` ECDSA signature over the `MobileBooking` EIP-712 message.
        issuedAt:
          type: integer
          description: Unix seconds - the struct's `issuedAt`.
        deadline:
          type: integer
          description: Unix seconds after which this claim is no longer accepted - the struct's `deadline`. Server-enforced max window of 600s (10 minutes) from `issuedAt`, independent of whatever the app set.

    MobilePetClaim:
      type: object
      description: |-
        The tag claim - asserted, not itself signed (see `docs/mobile-booking.md`'s assurance-level
        table: appointment annotation is accepted at level 1, corroborated on chain by the server's
        own tier resolution; a hijack of someone else's LOCAL pet record is guarded by the
        needs-review flag, never by this claim alone). `leaves`/`reservedLeafHashes` are the
        OPTIONAL level-2 verification data (Q3): both present together, or both absent - a request
        with only one is a malformed shape and is rejected, never silently downgraded.
      properties:
        dogTagIdDec:
          type: string
          pattern: "^\\d+$"
          description: |-
            The raw decimal handle, if known - base-10 digits only (the server enforces this
            pattern), NEVER hex and never 0x-prefixed. At least one of dogTagIdDec/dogTagIdField
            is required.
        dogTagIdField:
          type: string
          pattern: "^\\d+$"
          description: |-
            The canonical on-chain dogTagId as a decimal uint256 string, if known -
            `dogTagIdField(dogTagIdDec)` from `packages/dogtag-standard-ts`, exactly like
            `onchainDogTagId` in `CustodialBindResponse`: base-10 digits only (the server enforces
            this pattern), NEVER hex and never 0x-prefixed (the app "holds both id forms
            locally"). When both id forms are sent the server recomputes this from dogTagIdDec and
            rejects the claim on any mismatch, so the two must genuinely be the same tag's forms.
        name:
          type: string
          description: Off-chain display hint only - never chain-verified by itself.
        leaves:
          type: array
          maxItems: 61
          items: {$ref: '#/components/schemas/OpenedLeaf'}
          description: The pet's FULL opened profile-tree leaves (not a selective subset) - required alongside reservedLeafHashes for Q3 level-2 verification.
        reservedLeafHashes:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/Hex32'}

    BookAppointmentResponse:
      type: object
      required: [appointmentId, status, token]
      properties:
        appointmentId: {type: string}
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        ics:
          type: string
          description: Base64-encoded `.ics` calendar attachment, when the vet auto-confirms on booking.
        token:
          type: string
          description: |-
            The per-appointment client access token (the `AppointmentToken` parameter every other
            route in this section requires) - this IS the manage credential, returned directly so
            `GET/POST /v1/booking/appointments/{id}` and its `/cancel` companion are usable without
            ever having to fall back to parsing a confirmation email's link.

    AppointmentStatusResponse:
      type: object
      required: [appointmentId, status, startAt, serviceName]
      properties:
        appointmentId: {type: string}
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        startAt: {type: string, format: date-time}
        serviceName: {type: string}
        cancellable:
          type: boolean
          description: Whether `POST .../cancel` will currently succeed (false once past the vet's cancellation cutoff, or already cancelled).

    PaymentPublicStatusResponse:
      type: object
      required: [status, receiptAvailable]
      properties:
        status:
          type: string
          enum: [pending, paid, cancelled, expired]
        amount: {$ref: '#/components/schemas/Money'}
        receiptAvailable: {type: boolean}
        receiptUrl:
          type: string
          description: "Present iff `receiptAvailable`; the `GET /r/pay/{receiptToken}` URL."
        chain:
          type: string
          description: "Chain the matching transfer was observed on, e.g. `base-sepolia`. Absent while `status == pending`."
        txHash: {type: string}

    EntityCard:
      type: object
      required: [name, kind, branding, contact, address, coordinates, bookingEnabled]
      properties:
        name: {type: string}
        kind: {type: string, enum: [VET, GOVERNMENT, GROOMER]}
        branding:
          type: object
          properties:
            logoUrl: {type: string}
            primaryColor: {type: string}
        contact:
          type: object
          properties:
            email: {type: string, format: email}
            phone: {type: string}
        address:
          type: object
          properties:
            line1: {type: string}
            line2: {type: string}
            city: {type: string}
            region: {type: string}
            postalCode: {type: string}
            country: {type: string, description: ISO 3166-1 alpha-2.}
        coordinates:
          type: object
          required: [lat, lng]
          properties:
            lat: {type: number, minimum: -90, maximum: 90}
            lng: {type: number, minimum: -180, maximum: 180}
        bookingEnabled: {type: boolean}
